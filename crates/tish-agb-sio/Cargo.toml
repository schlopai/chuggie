[package]
name = "tish_agb_sio"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Serial IO (link cable) for agb, exposed to tish via cargo:tish_agb_sio"
repository = "https://github.com/schlopai/chuggie"

[dependencies]
# A plain registry dependency, NOT a path. `.cargo/config.toml` has
# `[patch.crates-io] agb = { path = "../agb/agb" }`, which already redirects this to our fork for
# every build under this repo — the path here was redundant with it, and actively harmful: cargo
# reads a path dependency's manifest even when publishing (where it strips the path), so a publish
# job that has not checked out the fork dies with
#   failed to read `/home/runner/work/chuggie/agb/agb/Cargo.toml`
agb = "0.25.0"
critical-section = "1.1.2"
tishlang_runtime_gba = { path = "../../../../tish/tish/crates/tish_runtime_gba", version = ">=0.1" }
