# GBA target defaults for every crate built in this workspace.
#
# NOTE on host/target split: proc-macro crates build for the host automatically,
# and the host-side LDtk asset importer is consumed as a [build-dependencies]
# entry (also built for host). Neither should be a plain workspace member that
# `cargo build` compiles for thumbv4t. See CONTRACT.md "Workspace host/target split".
[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "thumbv4t-none-eabi"

[target.thumbv4t-none-eabi]
runner = ["mgba-qt", "-C", "logToStdout=1", "-C", "logLevel.gba.debug=127"]
rustflags = [
    "-Clink-arg=-Tgba.ld",
    "-Ctarget-cpu=arm7tdmi",
    "-Cforce-frame-pointers=yes",
]

[target.armv4t-none-eabi]
runner = ["mgba-qt", "-C", "logToStdout=1", "-C", "logLevel.gba.debug=127"]
rustflags = [
    "-Clink-arg=-Tgba.ld",
    "-Ctarget-cpu=arm7tdmi",
    "-Cforce-frame-pointers=yes",
]

# Build every example against OUR agb fork, so fixes can be made here and filed upstream.
#
# It lives in the cargo config rather than in a manifest because the example ROMs are built from a
# STANDALONE crate that tish generates (`.tish/gba/<name>/Cargo.toml`, from a fixed template), so
# there is nowhere in a checked-in manifest to put a `[patch]`. Cargo reads config from every
# ancestor of the build directory, and those build directories all live under this repo.
#
# Fork: https://github.com/spacedevin/agb, pinned to an exact rev rather than a branch or a sibling
# checkout. A path here meant every CI job had to clone the fork first, and a branch would let the
# ROMs change under us without a commit in this repo. cargo fetches and caches the rev itself.
#
# The fork carries changes that are not in the published agb 0.25.0 — vram handling, a linker change
# putting .iwram in EWRAM, crash fixes, infinite-scroll backgrounds — so crates.io's agb cannot be
# used directly. Publishing the fork under its own crate name would remove even this; until then a
# pinned rev is the closest thing to a published, immutable dependency.
# agb is redirected HERE, not by a `path` in a manifest. A path in a manifest cannot be satisfied by
# the crates-release job — it checks out this repo alone — and cargo reads a path dependency's
# manifest even when publishing, where it strips the path and uses the version anyway.
#
# tishlang_runtime_gba is redirected the same way, and it MUST be: the ROM project tish generates
# path-depends on that exact directory, so tish_agb has to resolve to the same copy or the two see
# different tishlang_core types and the build fails with a mismatch.
[patch.crates-io]
agb = { git = "https://github.com/spacedevin/agb", rev = "2d0456f8e181b7011a3ebc54f36812ad378436d3" }
tishlang_runtime_gba = { path = "node_modules/@tishlang/tish/crates/tish_runtime_gba" }
