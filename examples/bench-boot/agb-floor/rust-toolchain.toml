# PINNED to match the repo root — see ../../../rust-toolchain.toml for why a bare
# `channel = "nightly"` is not acceptable here. This crate is a hand-written agb baseline (not
# generated by `tish build`), so this file is the one rustup actually reads for it; keeping it on the
# same dated toolchain is what makes it a valid floor to measure ROMs against.
[toolchain]
channel = "nightly-2026-07-22"
components = ["rust-src"]
