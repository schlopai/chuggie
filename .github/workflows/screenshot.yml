# Headless GBA screenshot in CI — proves a ROM boots and RENDERS, not just that it links.
# Uses libmgba in-process (no display / Xvfb / screen-recording needed), so it runs on a plain
# Linux runner. Builds a real example ROM with the published tish compiler from npm, and
# uploads the PNG as an artifact; a golden-image compare can be layered on top for visual regression.
name: GBA screenshot

on:
  pull_request:
    paths:
      - "crates/**"
      - "examples/overworld-demo/**"
      - "tools/gba-shot.c"
      - "scripts/screenshot.sh"
      - ".github/workflows/screenshot.yml"

permissions:
  contents: read
  # The job runs in ghcr.io/schlopai/chuggie-toolchain, same as ci.yml's container jobs.
  packages: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    # The toolchain — libmgba 0.10.5, the pinned rust nightly, agb-gbafix, node, imagemagick — comes
    # prebuilt in this image rather than being reassembled per job. Built and published from
    # schlopai/chuggie-toolchain; the tag is that Dockerfile's content hash, so what the job runs on
    # cannot change behind the pin. It is the SAME tag ci.yml pins — move both together.
    #
    # This job used to rebuild all of that itself on every PR touching crates/**: apt, a libmgba
    # source build (cached, but only the library), a rustup nightly, `cargo install agb-gbafix`
    # (compiled every run), setup-node. That is what the image exists to remove, and ci.yml's rom and
    # verify jobs had already moved into it; this was the one job still paying the old way.
    container:
      image: ghcr.io/schlopai/chuggie-toolchain:8f52ecdbceed
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 40
    steps:
      - name: Checkout chuggie
        uses: actions/checkout@v7

      # Every cargo invocation in this repo resolves .cargo/config.toml's patch, which points at
      # node_modules/@tishlang/tish/crates — so node_modules must exist before ANY cargo command,
      # not just the ones that build a ROM.
      - name: Install the pinned tish compiler
        run: npm ci

      # MGBA_PREFIX (/usr/local/mgba) is set by the image; scripts/shot_common.sh reads it, and
      # ensure_gba_shot compiles tools/gba-shot against it with the image's cc.
      - name: Build the overworld-demo ROM and capture a headless screenshot
        env:
          TISH: ${{ github.workspace }}/node_modules/.bin/tish
        run: ./scripts/screenshot.sh examples/overworld-demo/src/main.tish screenshot.png 200

      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        with:
          name: overworld-demo-screenshot
          path: screenshot.png
          if-no-files-found: error
