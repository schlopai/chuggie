# Headless GBA screenshot in CI — proves a ROM boots and RENDERS, not just that it links.
# Uses libmgba in-process (no display / Xvfb / screen-recording needed), so it runs on a plain
# Linux runner. Builds a real example ROM with the published tish compiler from npm, and
# uploads the PNG as an artifact; a golden-image compare can be layered on top for visual regression.
name: GBA screenshot

on:
  pull_request:
    paths:
      - "crates/**"
      - "examples/overworld-demo/**"
      - "tools/gba-shot.c"
      - "scripts/screenshot.sh"
      - ".github/workflows/screenshot.yml"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout chuggie
        uses: actions/checkout@v7

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick python3-pil libfreetype6-dev pkg-config cmake libpng-dev zlib1g-dev
      - name: Cache libmgba
        id: mgba-cache
        uses: actions/cache@v6
        with:
          path: ~/mgba-prefix
          key: mgba-0.10.5-${{ runner.os }}
      - name: Build libmgba 0.10.5
        if: steps.mgba-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba /tmp/mgba-src
          cmake -S /tmp/mgba-src -B /tmp/mgba-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/mgba-prefix" -DBUILD_QT=OFF -DBUILD_SDL=OFF \
            -DUSE_FFMPEG=OFF -DUSE_SQLITE3=OFF -DUSE_DISCORD_RPC=OFF -DUSE_EDITLINE=OFF \
            -DUSE_ELF=OFF -DUSE_EPOXY=OFF -DBUILD_GL=OFF -DBUILD_GLES2=OFF
          make -C /tmp/mgba-build -j"$(nproc)" install

      - name: Rust nightly + rust-src (GBA build-std target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-22
          components: rust-src
      - name: Install agb-gbafix (ELF -> .gba)
        run: cargo install --locked agb-gbafix

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Every cargo invocation in this repo resolves .cargo/config.toml's patch, which points at
      # node_modules/@tishlang/tish/crates — so node_modules must exist before ANY cargo command,
      # not just the ones that build a ROM.
      - name: Install the pinned tish compiler
        run: npm ci

      - name: Build the overworld-demo ROM and capture a headless screenshot
        env:
          TISH: ${{ github.workspace }}/node_modules/.bin/tish
          MGBA_PREFIX: /home/runner/mgba-prefix
        run: ./scripts/screenshot.sh examples/overworld-demo/src/main.tish screenshot.png 200

      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        with:
          name: overworld-demo-screenshot
          path: screenshot.png
          if-no-files-found: error
