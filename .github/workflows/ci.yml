# Test on every push/PR; on a green main, cut a PRERELEASE carrying the npm tarball.
#
# Version bumps use tishlang/sem (@tishlang/sem) — Conventional Commits drive semver
# (feat/fix/perf/BREAKING release; chore/docs/ci do not). Config: .semrc.json
#
# Promoting that prerelease to a full release is what fires npm-release.yml and crates-release.yml.
# The two-step exists so a release is never published by the same run that decided to make one —
# there is a human between "CI is green" and "this is on npm forever".
#
# Layout note: the crates carry `../../../../tish/tish/crates/...` path deps on the compiler repo
# and .cargo/config.toml patches agb to `../agb/agb`, mirroring the local checkout layout. Every
# job therefore reproduces that tree inside the workspace:
#   $GITHUB_WORKSPACE/chuggie/chuggie + $GITHUB_WORKSPACE/chuggie/agb
#   $GITHUB_WORKSPACE/tish/tish
# (screenshot.yml does the same — keep the two in step.)

name: CI (test, prerelease)

on:
  push:
    branches: [main]
    # Files no job here reads. A push or PR that touches ONLY these does not start a run at all —
    # on main that also means nightly.link keeps serving the previous, complete run's ROMs.
    #
    # NOT in this list, on purpose: examples/**/README.md and examples/README.md (examples_index
    # checks them), packages/README.md (ships in the npm tarball), LICENSE (the release job gates on
    # it). `*.md` without a leading `**/` matches the ROOT only. The discover job below applies the
    # same list when it narrows the verify matrix — keep the two in step.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/README.md"
      - "scripts/README.md"
      - "tools/README.md"
      - ".vscode/**"
      - ".mcp.json"

  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/README.md"
      - "scripts/README.md"
      - "tools/README.md"
      - ".vscode/**"
      - ".mcp.json"

  # By hand: always the FULL verify matrix, whatever the last push touched (see discover).
  workflow_dispatch:

permissions:
  contents: write
  # crates, rom and verify run in ghcr.io/schlopai/chuggie-toolchain.
  packages: read

jobs:
  # ── Host-target crate tests. Fast, and the only job that gates on every PR path. ──────────────

  # ── Host-target crate tests. Fast, and the only job that gates on every PR path. ──────────────
  crates:
    name: Cargo tests (host)
    runs-on: ubuntu-latest
    # The toolchain — libmgba 0.10.5, the pinned rust nightly, agb-gbafix, node — comes prebuilt
    # in this image rather than being reassembled per job. Built and published from
    # schlopai/chuggie-toolchain; the tag is that Dockerfile's content hash, so what the jobs
    # run on cannot change behind the pin.
    container:
      image: ghcr.io/schlopai/chuggie-toolchain:8f52ecdbceed
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # freetype-sys in scenepack's host dependency tree links the system freetype.

      # Only scenepack builds for the host — the rest are thumbv4t-none-eabi only and are covered by
      # the ROM job below. This is where the shared .deck conformance corpus runs: corpus_bakes and
      # gba_profile_is_honest prove this bake still agrees with @spacedevin/deck and that the `gba`
      # profile's reject list is honest rather than aspirational.
      # Every cargo invocation in this repo resolves .cargo/config.toml's patch, which points at
      # node_modules/@tishlang/tish/crates — so node_modules must exist before ANY cargo command,
      # not just the ones that build a ROM.
      - name: Install the pinned tish compiler
        run: npm ci
      - name: Test tish_gba_scenepack
        working-directory: crates/tish-gba-scenepack
        run: cargo test --locked

      - name: rustfmt (all crates)
        run: |
          for c in tish-agb tish-agb-sio tish-gba-game-engine tish-gba-scenepack; do
            (cd "crates/$c" && cargo fmt --check) || { echo "::error::cargo fmt --check failed for $c"; exit 1; }
          done

      - name: clippy tish_gba_scenepack (host)
        working-directory: crates/tish-gba-scenepack
        run: cargo clippy --all-targets -- -D warnings

      - name: Check and clippy the other crates (thumbv4t, no link)
        run: |
          # rust-toolchain.toml pins the nightly (never float it — a fresh nightly means fresh
          # lints and a red CI that local checkouts cannot reproduce); this installs that pin.
          rustup toolchain install
          for c in tish-agb tish-agb-sio tish-gba-game-engine; do
            echo "::group::cargo clippy $c"
            # -Z build-std: the GBA target has no prebuilt std/core, same as a real ROM build.
            # clippy subsumes check: it fails on the same compile errors plus lint warnings.
            (cd "crates/$c" && cargo clippy --target thumbv4t-none-eabi \
              -Z build-std=core,alloc -- -D warnings 2>&1) || { echo "::error::cargo clippy failed for $c"; exit 1; }
            echo "::endgroup::"
          done

  # ── A real ROM, built the way a game is built. Proves the toolchain + agb linkage still work. ──
  # ── Every example ROM, built once and kept. ──────────────────────────────────────────────────────
  #
  # chuggie.dev embeds an mGBA player and offers a PLAY button for each example, but `**/*.gba` is
  # gitignored here, so the ROMs existed only where someone had built them. The site's build scanned
  # a sibling checkout for *.gba: on a maintainer's laptop that found 148 ROMs, and anywhere else it
  # found none and shipped dead buttons. https://chuggie.dev/examples-roms/shmup/shmup.gba was a 404.
  #
  # So CI builds them and uploads them as an artifact the site can fetch.
  #
  # Sharded rather than one job per example: the toolchain setup (rust, agb-gbafix, freetype, the
  # tish compiler) costs minutes and would be paid 125 times over. Each shard pays it once and then
  # builds its slice, which is seconds per example against a warm cargo cache.

  # ── A real ROM, built the way a game is built. Proves the toolchain + agb linkage still work. ──
  rom:
    name: Build a ROM
    runs-on: ubuntu-latest
    # The toolchain — libmgba 0.10.5, the pinned rust nightly, agb-gbafix, node — comes prebuilt
    # in this image rather than being reassembled per job. Built and published from
    # schlopai/chuggie-toolchain; the tag is that Dockerfile's content hash, so what the jobs
    # run on cannot change behind the pin.
    container:
      image: ghcr.io/schlopai/chuggie-toolchain:8f52ecdbceed
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The SAME pinned nightly rust-toolchain.toml names — a floating nightly changes ROM
      # codegen and shifts frame-exact verifier timings against local builds.
      # freetype-sys in the host-side asset bake links the system freetype.
      - name: Install the pinned tish compiler
        run: npm ci
      - name: Build grid-demo
        working-directory: examples/grid-demo
        env:
          TISH: ${{ github.workspace }}/node_modules/.bin/tish
        run: |
          "$TISH" build src/main.tish --target gba -o grid-demo.gba
          ls -l grid-demo.gba
      - uses: actions/upload-artifact@v7
        with:
          name: grid-demo-rom
          path: examples/grid-demo/grid-demo.gba
          if-no-files-found: error

  # ── The example verifiers: build a ROM, emulate it, and assert on what came out. ──────────────
  #
  # These are the real regression net — they FFT captured audio against the bpm the `.deck` file was
  # authored at and diff rendered frames against golden PNGs, so a parse or lowering regression is
  # caught as a wrong-sounding or wrong-looking ROM rather than a passing unit test.
  #
  # Matrixed one job per example with fail-fast:false, because a single ROM build is ~2 minutes and
  # running 50 of them serially is hours. The list is DISCOVERED, not hand-maintained — a new
  # verify.sh is picked up without editing this file.

  verify:
    name: verify ${{ matrix.example }}
    needs: [crates, discover]
    # An empty matrix is a workflow error, not a no-op. discover hands one over when a push to main
    # touched nothing a ROM depends on; the job is then SKIPPED, and release/example_roms below know
    # skipped from failed.
    if: needs.discover.outputs.examples != '[]'
    runs-on: ubuntu-latest
    # The toolchain — libmgba 0.10.5, the pinned rust nightly, agb-gbafix, node — comes prebuilt
    # in this image rather than being reassembled per job. Built and published from
    # schlopai/chuggie-toolchain; the tag is that Dockerfile's content hash, so what the jobs
    # run on cannot change behind the pin.
    container:
      image: ghcr.io/schlopai/chuggie-toolchain:8f52ecdbceed
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      # libmgba is built from source at the SAME version the local machines run (Ubuntu noble
      # packages 0.10.2, and the version gap shows up as emulator-timing and capture failures).
      # The SAME pinned nightly rust-toolchain.toml names — a floating nightly changes ROM
      # codegen and shifts frame-exact verifier timings against local builds.
      # Several verifiers call tools/gba-shot (and gba-link) directly; the binaries are
      # gitignored, so build them from source here (same flags scripts/screenshot.sh uses).
      - name: Build the gba-shot/gba-link helper tools
        run: |
          P="$MGBA_PREFIX"
          cc tools/gba-shot.c -o tools/gba-shot -I"$P/include" -L"$P/lib" -lmgba -lm -Wl,-rpath,"$P/lib"
          cc tools/gba-link.c -o tools/gba-link -I"$P/include" -L"$P/lib" -lmgba -lm -Wl,-rpath,"$P/lib"
      # The compiler is a published npm package with a prebuilt binary per platform. Building it
      # from source cost ~1m20s in EVERY job that needed it, 57 per run, to produce what npm hands
      # over in seconds. It must be INSTALLED, not just downloaded: `tish` locates its own Rust
      # workspace by walking up to node_modules/@tishlang/tish.
      - name: Install the pinned tish compiler
        run: npm ci
      - name: Run the verifier
        working-directory: examples/${{ matrix.example }}
        env:
          TISH: ${{ github.workspace }}/node_modules/.bin/tish
        run: |
          # Some verifiers build through `npm run build`, which invokes a bare `tish`.
          export PATH="$(dirname "$TISH"):$PATH"
          if [ -f ./verify.sh ]; then
            ./verify.sh
          else
            # No verifier of its own — the baseline: builds, boots, no crash, draws something.
            npm run build
            ../../scripts/verify_default.sh "${{ matrix.example }}"
          fi

      # The verifier just built this example's ROM to emulate it. Keep it, rather than having the
      # rom matrix compile the same thing again.
      #
      # always(): a verifier can fail on an assertion about a ROM that built perfectly well, and that
      # ROM is still the right one to publish. if-no-files-found: ignore, because a verifier that
      # failed BEFORE building leaves nothing, which is not an error here.
      - name: Keep the ROM this verifier built
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-roms-verify-${{ matrix.example }}
          path: examples/${{ matrix.example }}/*.gba
          if-no-files-found: ignore
          retention-days: 30

  discover:
    name: Discover verifiers
    runs-on: ubuntu-latest
    outputs:
      # `examples` is what verify runs. `carry` is what it does NOT run this time and example_roms
      # must copy over from an earlier main run instead (empty unless narrow decided to narrow).
      examples: ${{ steps.narrow.outputs.examples }}
      carry: ${{ steps.narrow.outputs.carry }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          # EVERY example that is not a bench or a repro, as a JSON array for the matrix above.
          #
          # It used to list only examples with a verify.sh — 44 of the 90 games. The other 46 were
          # compiled by nobody and run by nobody, so a ROM that crashed on boot or drew a blank
          # screen shipped green. Those get scripts/verify_default.sh instead: builds, boots, does
          # not crash, draws something.
          #
          # bench-*/repro-*/probe-*/p0-* are excluded — they measure or reproduce, most render
          # nothing at all, and the same four prefixes split games from diagnostics in
          # scripts/gen_examples_readme.py.
          list=$(for d in examples/*/; do
                   ex="$(basename "$d")"
                   case "$ex" in bench-*|repro-*|probe-*|p0-*) continue ;; esac
                   [ -f "$d/package.json" ] || continue
                   grep -q '"build"' "$d/package.json" || continue
                   printf '%s\n' "$ex"
                 done | sort | jq -R . | jq -sc .)
          echo "all=$list" >> "$GITHUB_OUTPUT"
          echo "$(echo "$list" | jq 'length') examples have a verifier"

      # ── On a push to main, verify only what that push could have changed. ──────────────────────
      #
      # A PR run verifies every example; the merge then pushes the SAME tree to main and, until now,
      # verified all 90 again — ~250 billed minutes a merge, for 44 merges a month. The re-run on
      # main is worth having (the merge commit is not the PR head; main may have moved under it),
      # but a change confined to examples/<a>/ and examples/<b>/ cannot alter any other ROM, so
      # only a and b are rebuilt.
      #
      # Anything shared — crates/, packages/, scripts/, assets/, tools/, .cargo/, the toolchain pin,
      # package.json / package-lock.json, this file — is an input to EVERY ROM, and one such file in
      # the push means the full matrix. This is decided by elimination, not by a list of what is
      # shared: every changed file must sit under some examples/<name>/, or nothing is narrowed.
      #
      # Examples do reach into each other (sunnyside-* import ../sunnyside/src, warforge reads
      # ../rts-*/), so a touched example drags along every example whose files mention ../<it>/,
      # to a fixed point. That over-includes (a mention in a comment counts); it never under-includes.
      #
      # PRs and workflow_dispatch always get the full matrix, and so does any push whose parent
      # cannot be fetched (first push, a force-push whose old tip is gone).
      - id: narrow
        env:
          ALL: ${{ steps.list.outputs.all }}
          BEFORE: ${{ github.event.before }}
        run: |
          examples="$ALL"
          carry='[]'
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
              echo "::notice::No parent to diff against (${BEFORE:0:12}) — verifying every example."
            else
              changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
              # The same files `paths-ignore` at the top of this file leaves out, plus the generated
              # examples index (examples_index checks it; no ROM reads it). Keep in step with `on:`.
              relevant="$(printf '%s\n' "$changed" \
                | grep -Ev '^(docs/|[^/]+\.md$|assets/README\.md$|scripts/README\.md$|tools/README\.md$|\.vscode/|\.mcp\.json$|examples/README\.md$)' \
                || true)"
              if [ -n "$relevant" ] && printf '%s\n' "$relevant" | grep -qvE '^examples/[^/]+/'; then
                echo "A shared file changed — verifying every example:"
                printf '%s\n' "$relevant" | grep -vE '^examples/[^/]+/' | sed 's/^/  /'
              else
                touched="$(printf '%s\n' "$relevant" | sed -nE 's#^examples/([^/]+)/.*#\1#p' | sort -u)"
                # Close over ../<name>/ references until nothing new appears.
                while :; do
                  pat="$(printf '%s\n' "$touched" | paste -sd'|' -)"
                  [ -n "$pat" ] || break
                  # `|| true`: no file mentioning it is the common case, and grep says so with exit 1.
                  more="$(grep -rlE "\.\./($pat)/" examples --exclude-dir=node_modules --exclude-dir=.tish 2>/dev/null \
                    | cut -d/ -f2 | sort -u || true)"
                  next="$(printf '%s\n%s\n' "$touched" "$more" | sed '/^$/d' | sort -u)"
                  [ "$next" = "$touched" ] && break
                  touched="$next"
                done
                touched_json="$(printf '%s\n' "$touched" | sed '/^$/d' | jq -R . | jq -sc .)"
                # Only examples that HAVE a verifier (a touched bench-* is not in $ALL); order as $ALL.
                examples="$(jq -nc --argjson all "$ALL" --argjson t "$touched_json" '$all - ($all - $t)')"
                carry="$(jq -nc --argjson all "$ALL" --argjson e "$examples" '$all - $e')"
                echo "::notice::Push touched only examples/ — verifying $(jq length <<<"$examples") of $(jq length <<<"$ALL") examples; the rest are carried forward from the previous main run."
              fi
            fi
          fi
          echo "examples=$examples" >> "$GITHUB_OUTPUT"
          echo "carry=$carry" >> "$GITHUB_OUTPUT"
          echo "Verifying $(jq length <<<"$examples") examples: $(jq -r 'join(" ")' <<<"$examples")"

  # ── The examples index is GENERATED, so it cannot drift from the examples it lists. ──────────────
  # Fails on two things: an example with no README.md (nobody can find an undocumented example, and
  # the index is built from those READMEs), and a stale examples/README.md (someone edited an
  # example's README without re-running the generator).
  #
  # A MISSING SCREENSHOT IS NOT A FAILURE HERE — it needs a built ROM and an emulator, which is the
  # `verify` job's territory, not a docs check. The generator lists the ones without a screenshot in
  # the index itself so the gap stays visible instead of silently absent.

  # ── The examples index is GENERATED, so it cannot drift from the examples it lists. ──────────────
  # Fails on two things: an example with no README.md (nobody can find an undocumented example, and
  # the index is built from those READMEs), and a stale examples/README.md (someone edited an
  # example's README without re-running the generator).
  #
  # A MISSING SCREENSHOT IS NOT A FAILURE HERE — it needs a built ROM and an emulator, which is the
  # `verify` job's territory, not a docs check. The generator lists the ones without a screenshot in
  # the index itself so the gap stays visible instead of silently absent.
  examples_index:
    name: Examples index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check examples/README.md is current
        run: python3 scripts/gen_examples_readme.py --check

  # ── Would this land a release? Runs on PRs so a bad commit type is caught before merge. ───────

  # ── Would this land a release? Runs on PRs so a bad commit type is caught before merge. ───────
  release_check:
    name: Release check (sem dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Dry-run sem
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report bump
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" = "true" ]; then
            echo "::notice::Would release ${{ steps.sem.outputs.new_release_version }} from these commits."
          elif [ "${{ steps.sem.outputs.skipped }}" = "true" ]; then
            echo "::notice::Soft-skipped (${{ steps.sem.outputs.skip_reason }})."
          else
            echo "::notice::No release would be cut from these commits."
          fi

  # ── Green main → prerelease. Promote it by hand to publish. ───────────────────────────────────

  # ── Green main → prerelease. Promote it by hand to publish. ───────────────────────────────────
  release:
    name: Prerelease
    # Spelled out per job rather than the bare default, because `verify` may legitimately be
    # SKIPPED on a push to main (discover narrowed it to nothing — the PR run already verified that
    # tree) and the default `needs` rule treats a skipped dependency like a failed one. Everything
    # else must have actually succeeded; a skipped `crates` or `rom` is still no release.
    if: >-
      always()
      && github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.crates.result == 'success'
      && needs.rom.result == 'success'
      && needs.release_check.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    needs: [crates, rom, verify, release_check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # @sem/github opens a failure issue when a release throws. Without this it cannot, and the
      # real error is buried under a 403 from the issues API.
      issues: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }

      # WHY THIS REPO HAD NO RELEASES. sem computed v0.1.0 correctly every time and then died on
      # `Failed to create tag v0.1.0: Committer identity unknown` — a tag is a commit-shaped object
      # and actions/checkout does not configure one. Every prerelease since the sem migration failed
      # here, which is why the repo has zero releases and zero tags despite months of feat: commits.
      - name: Configure git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Next version via sem (dry-run)
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when no bump
        id: gate
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" != "true" ]; then
            echo "::notice::No version bump — skipping prerelease."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.sem.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${{ steps.sem.outputs.new_release_version }}"

      # The licence gate. crates.io has no delete — only yank — and npm unpublish is a 72-hour
      # window, so an artifact published under the wrong licence is effectively permanent. Refuse to
      # build a release artifact unless the LICENSE file the crates and the package point at is
      # actually there. (This is not hypothetical: @spacedevin/deck shipped two versions under the
      # wrong licence and both had to be yanked.)
      - name: Refuse to package without a licence
        if: steps.gate.outputs.continue == 'true'
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ] && [ ! -f LICENSE.txt ]; then
            echo "::error::No LICENSE file at the repo root, but crates/*/Cargo.toml and packages/package.json declare \"MIT\". Add the LICENSE file, or correct the declarations, before anything is published."
            exit 1
          fi

      - name: Stamp the version and pack the engine package
        if: steps.gate.outputs.continue == 'true'
        run: |
          V="${{ steps.gate.outputs.version }}"
          node -e '
            const fs = require("fs"), p = "packages/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$V"
          (cd packages && npm pack)
          mv packages/schlopai-chuggie-*.tgz tish-gba-npm-package.tgz
          ls -l tish-gba-npm-package.tgz

      - name: Create the prerelease via @sem/github
        if: steps.gate.outputs.continue == 'true'
        uses: tishlang/sem@v1
        with:
          force: ${{ steps.gate.outputs.version }}
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              - - "@sem/npm"
                - npmPublish: false
                  pkgRoot: packages
              - - "@sem/github"
                - prerelease: true
                  successComment: false
                  assets:
                    - path: tish-gba-npm-package.tgz
                      name: tish-gba-npm-package.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── The ROMs the verifiers already built, as one artifact for chuggie.dev. ───────────────────────
  #
  # No job builds a ROM for this. The verify matrix compiles each example to emulate it and uploads
  # what it made; this only gathers those into the layout the site reads. 49 of the 125 examples have
  # a verifier, so 49 ROMs — the rest have nothing that would build them, and adding a matrix to do
  # so is what turned this pipeline into two build paths.
  example_roms:
    name: Bundle example ROMs
    needs: [verify, discover]
    # `verify` skipped (not failed) is a narrowed push to main that rebuilt nothing — this job still
    # has to run then, because the carry-forward below is what keeps that run's artifacts complete.
    if: always() && needs.discover.result == 'success' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      # The carry-forward lists and downloads an EARLIER run's artifacts through the REST API.
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: example-roms-verify-*
          path: incoming

      # ── Carry forward what this run did not rebuild. ───────────────────────────────────────────
      #
      # chuggie.dev does not read the bundle below. Its player proxies
      #   https://nightly.link/schlopai/chuggie/workflows/ci/main/example-roms-verify-<id>.zip
      # which is the per-example artifact of the LATEST SUCCESSFUL run of this workflow on main.
      # When discover narrowed the matrix, this run is that run, and it uploaded only the examples it
      # rebuilt: every other PLAY button on the site would 404 the moment it went green. So the
      # examples this run skipped are fetched from the newest earlier main run that has them and
      # re-uploaded here under the same names, and the latest main run always carries all 90.
      #
      # Skipped examples ONLY. One this run verified and failed to build gets no stale stand-in — a
      # missing ROM there is the signal it always was.
      #
      # actions/upload-artifact is one artifact per step and this list is dynamic, so the upload
      # goes through @actions/artifact, the library that action is built on, pinned. Same runtime
      # token, same backend, same artifact.
      - name: Install the artifact client for the carry-forward
        if: needs.discover.outputs.carry != '[]'
        run: npm install --no-save --no-audit --no-fund @actions/artifact@6.2.1
      - name: Carry forward the ROMs this run did not rebuild
        if: needs.discover.outputs.carry != '[]'
        uses: actions/github-script@v8
        env:
          CARRY: ${{ needs.discover.outputs.carry }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const { DefaultArtifactClient } = require(path.join(process.cwd(), 'node_modules/@actions/artifact'));
            const { owner, repo } = context.repo;
            const wanted = new Set(JSON.parse(process.env.CARRY).map(ex => `example-roms-verify-${ex}`));

            // Newest artifact per name, looking back through the last completed runs on main. A run
            // that died before verify has none and contributes nothing; one where a verifier failed
            // still has the ROMs it did build.
            const found = new Map();
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch: 'main', status: 'completed', per_page: 10,
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                                                 { owner, repo, run_id: run.id, per_page: 100 });
              for (const a of arts) {
                if (wanted.has(a.name) && !a.expired && !found.has(a.name)) found.set(a.name, { run, a });
              }
              if (found.size === wanted.size) break;
            }
            if (found.size === 0) {
              core.setFailed('no earlier completed run on main carries example ROMs — run this workflow by hand (workflow_dispatch) to rebuild every example');
              return;
            }
            for (const name of wanted) {
              if (!found.has(name)) core.warning(`${name}: not in the last 10 main runs either — no ROM to carry`);
            }

            const client = new DefaultArtifactClient();
            let n = 0;
            for (const [name, { run, a }] of found) {
              // Into incoming/<name>/ — the layout download-artifact used above — so the bundle
              // below folds these in next to the ones this run built.
              const dir = path.join('incoming', name);
              await client.downloadArtifact(a.id, {
                path: dir,
                findBy: { token: process.env.GH_TOKEN, workflowRunId: run.id, repositoryOwner: owner, repositoryName: repo },
              });
              const files = fs.readdirSync(dir).filter(f => f.endsWith('.gba')).map(f => path.join(dir, f));
              if (files.length === 0) { core.warning(`${name} from run ${run.id} holds no .gba`); continue; }
              await client.uploadArtifact(name, files, dir, { retentionDays: 30 });
              core.info(`${name}: carried from run ${run.id}`);
              n++;
            }
            core.notice(`${n} example ROM artifact(s) carried forward from earlier main runs`);

      - name: Fold into <id>/<name>.gba
        run: |
          shopt -s nullglob
          mkdir -p roms
          for d in incoming/example-roms-verify-*/; do
            ex="$(basename "$d")"; ex="${ex#example-roms-verify-}"
            for rom in "$d"*.gba; do mkdir -p "roms/$ex"; cp "$rom" "roms/$ex/"; done
          done
          n=$(find roms -name '*.gba' | wc -l)
          echo "$n ROM(s) bundled"
          [ "$n" -gt 0 ] || { echo "::error::the verify matrix produced no ROMs"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: example-roms
          path: roms/
          if-no-files-found: error
          retention-days: 90
