# Test on every push/PR; on a green main, cut a PRERELEASE carrying the npm tarball.
#
# Version bumps use tishlang/sem (@tishlang/sem) — Conventional Commits drive semver
# (feat/fix/perf/BREAKING release; chore/docs/ci do not). Config: .semrc.json
#
# Promoting that prerelease to a full release is what fires npm-release.yml and crates-release.yml.
# The two-step exists so a release is never published by the same run that decided to make one —
# there is a human between "CI is green" and "this is on npm forever".
#
# Layout note: the crates carry `../../../../tish/tish/crates/...` path deps on the compiler repo
# and .cargo/config.toml patches agb to `../agb/agb`, mirroring the local checkout layout. Every
# job therefore reproduces that tree inside the workspace:
#   $GITHUB_WORKSPACE/chuggie/chuggie-engine + $GITHUB_WORKSPACE/chuggie/agb
#   $GITHUB_WORKSPACE/tish/tish
# (screenshot.yml does the same — keep the two in step.)

name: CI (test, prerelease)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Host-target crate tests. Fast, and the only job that gates on every PR path. ──────────────
  crates:
    name: Cargo tests (host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Reproduce the local sibling layout exactly: the crates carry
      # `../../../../tish/tish/crates/...` path deps and .cargo/config.toml patches agb to
      # `../agb/agb`, so the tree must look like
      #   $GITHUB_WORKSPACE/chuggie/chuggie-engine + $GITHUB_WORKSPACE/chuggie/agb
      #   $GITHUB_WORKSPACE/tish/tish
      - uses: actions/checkout@v7
        with:
          path: chuggie/chuggie-engine
      - uses: actions/checkout@v7
        with:
          repository: spacedevin/agb
          ref: chuggie
          path: chuggie/agb
      - uses: actions/checkout@v7
        with:
          repository: tishlang/tish
          path: tish/tish
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chuggie/chuggie-engine/crates/tish-gba-scenepack
      # freetype-sys in scenepack's host dependency tree links the system freetype.
      - name: Install freetype
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev pkg-config

      # Only scenepack builds for the host — the rest are thumbv4t-none-eabi only and are covered by
      # the ROM job below. This is where the shared .deck conformance corpus runs: corpus_bakes and
      # gba_profile_is_honest prove this bake still agrees with @spacedevin/deck and that the `gba`
      # profile's reject list is honest rather than aspirational.
      - name: Test tish_gba_scenepack
        working-directory: chuggie/chuggie-engine/crates/tish-gba-scenepack
        run: cargo test --locked

      - name: rustfmt (all crates)
        working-directory: chuggie/chuggie-engine
        run: |
          for c in tish-agb tish-agb-sio tish-gba-game-engine tish-gba-scenepack; do
            (cd "crates/$c" && cargo fmt --check) || { echo "::error::cargo fmt --check failed for $c"; exit 1; }
          done

      - name: clippy tish_gba_scenepack (host)
        working-directory: chuggie/chuggie-engine/crates/tish-gba-scenepack
        run: cargo clippy --all-targets -- -D warnings

      - name: Check and clippy the other crates (thumbv4t, no link)
        working-directory: chuggie/chuggie-engine
        run: |
          # rust-toolchain.toml pins the nightly (never float it — a fresh nightly means fresh
          # lints and a red CI that local checkouts cannot reproduce); this installs that pin.
          rustup toolchain install
          for c in tish-agb tish-agb-sio tish-gba-game-engine; do
            echo "::group::cargo clippy $c"
            # -Z build-std: the GBA target has no prebuilt std/core, same as a real ROM build.
            # clippy subsumes check: it fails on the same compile errors plus lint warnings.
            (cd "crates/$c" && cargo clippy --target thumbv4t-none-eabi \
              -Z build-std=core,alloc -- -D warnings 2>&1) || { echo "::error::cargo clippy failed for $c"; exit 1; }
            echo "::endgroup::"
          done

  # ── A real ROM, built the way a game is built. Proves the toolchain + agb linkage still work. ──
  rom:
    name: Build a ROM
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: chuggie/chuggie-engine
      - uses: actions/checkout@v7
        with:
          repository: tishlang/tish
          path: tish/tish
      - uses: actions/checkout@v7
        with:
          repository: spacedevin/agb
          ref: chuggie
          path: chuggie/agb
      # The SAME pinned nightly rust-toolchain.toml names — a floating nightly changes ROM
      # codegen and shifts frame-exact verifier timings against local builds.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-22
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tish/tish
      # freetype-sys in the host-side asset bake links the system freetype.
      - name: Install freetype
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev pkg-config
      - name: Install agb-gbafix (ELF -> .gba)
        run: cargo install --locked agb-gbafix
      - name: Build the tish compiler
        working-directory: tish/tish
        run: cargo build --release -p tishlang
      - name: Build grid-demo
        working-directory: chuggie/chuggie-engine/examples/grid-demo
        env:
          TISH: ${{ github.workspace }}/tish/tish/target/release/tish
        run: |
          "$TISH" build src/main.tish --target gba -o grid-demo.gba
          ls -l grid-demo.gba
      - uses: actions/upload-artifact@v7
        with:
          name: grid-demo-rom
          path: chuggie/chuggie-engine/examples/grid-demo/grid-demo.gba
          if-no-files-found: error

  # ── The example verifiers: build a ROM, emulate it, and assert on what came out. ──────────────
  #
  # These are the real regression net — they FFT captured audio against the bpm the `.deck` file was
  # authored at and diff rendered frames against golden PNGs, so a parse or lowering regression is
  # caught as a wrong-sounding or wrong-looking ROM rather than a passing unit test.
  #
  # Matrixed one job per example with fail-fast:false, because a single ROM build is ~2 minutes and
  # running 50 of them serially is hours. The list is DISCOVERED, not hand-maintained — a new
  # verify.sh is picked up without editing this file.
  verify:
    name: verify ${{ matrix.example }}
    needs: [crates, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: chuggie/chuggie-engine
      - uses: actions/checkout@v7
        with:
          repository: tishlang/tish
          path: tish/tish
      - uses: actions/checkout@v7
        with:
          repository: spacedevin/agb
          ref: chuggie
          path: chuggie/agb
      - name: Install tooling the verifiers use
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick python3-numpy python3-pil libfreetype6-dev pkg-config cmake libpng-dev zlib1g-dev
      # libmgba is built from source at the SAME version the local machines run (Ubuntu noble
      # packages 0.10.2, and the version gap shows up as emulator-timing and capture failures).
      - name: Cache libmgba
        id: mgba-cache
        uses: actions/cache@v6
        with:
          path: ~/mgba-prefix
          key: mgba-0.10.5-${{ runner.os }}
      - name: Build libmgba 0.10.5
        if: steps.mgba-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba /tmp/mgba-src
          cmake -S /tmp/mgba-src -B /tmp/mgba-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/mgba-prefix" -DBUILD_QT=OFF -DBUILD_SDL=OFF \
            -DUSE_FFMPEG=OFF -DUSE_SQLITE3=OFF -DUSE_DISCORD_RPC=OFF -DUSE_EDITLINE=OFF \
            -DUSE_ELF=OFF -DUSE_EPOXY=OFF -DBUILD_GL=OFF -DBUILD_GLES2=OFF
          make -C /tmp/mgba-build -j"$(nproc)" install
      # The SAME pinned nightly rust-toolchain.toml names — a floating nightly changes ROM
      # codegen and shifts frame-exact verifier timings against local builds.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-22
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tish/tish
      - run: cargo install --locked agb-gbafix
      # Several verifiers call tools/gba-shot (and gba-link) directly; the binaries are
      # gitignored, so build them from source here (same flags scripts/screenshot.sh uses).
      - name: Build the gba-shot/gba-link helper tools
        working-directory: chuggie/chuggie-engine
        run: |
          P="$HOME/mgba-prefix"
          cc tools/gba-shot.c -o tools/gba-shot -I"$P/include" -L"$P/lib" -lmgba -lm -Wl,-rpath,"$P/lib"
          cc tools/gba-link.c -o tools/gba-link -I"$P/include" -L"$P/lib" -lmgba -lm -Wl,-rpath,"$P/lib"
      - name: Build the tish compiler
        working-directory: tish/tish
        run: cargo build --release -p tishlang
      - name: Run the verifier
        working-directory: chuggie/chuggie-engine/examples/${{ matrix.example }}
        env:
          TISH: ${{ github.workspace }}/tish/tish/target/release/tish
          MGBA_PREFIX: /home/runner/mgba-prefix
        run: |
          # Some verifiers build through `npm run build`, which invokes a bare `tish`.
          export PATH="$(dirname "$TISH"):$PATH"
          ./verify.sh

  discover:
    name: Discover verifiers
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          # Every examples/<name>/verify.sh, as a JSON array for the matrix above.
          list=$(find examples -mindepth 2 -maxdepth 2 -name verify.sh -type f \
                 | sed 's#examples/##; s#/verify.sh##' | sort | jq -R . | jq -sc .)
          echo "examples=$list" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "$list" | jq 'length') verifiers"

  # ── The examples index is GENERATED, so it cannot drift from the examples it lists. ──────────────
  # Fails on two things: an example with no README.md (nobody can find an undocumented example, and
  # the index is built from those READMEs), and a stale examples/README.md (someone edited an
  # example's README without re-running the generator).
  #
  # A MISSING SCREENSHOT IS NOT A FAILURE HERE — it needs a built ROM and an emulator, which is the
  # `verify` job's territory, not a docs check. The generator lists the ones without a screenshot in
  # the index itself so the gap stays visible instead of silently absent.
  examples_index:
    name: Examples index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check examples/README.md is current
        run: python3 scripts/gen_examples_readme.py --check

  # ── Would this land a release? Runs on PRs so a bad commit type is caught before merge. ───────
  release_check:
    name: Release check (sem dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Dry-run sem
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report bump
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" = "true" ]; then
            echo "::notice::Would release ${{ steps.sem.outputs.new_release_version }} from these commits."
          elif [ "${{ steps.sem.outputs.skipped }}" = "true" ]; then
            echo "::notice::Soft-skipped (${{ steps.sem.outputs.skip_reason }})."
          else
            echo "::notice::No release would be cut from these commits."
          fi

  # ── Green main → prerelease. Promote it by hand to publish. ───────────────────────────────────
  release:
    name: Prerelease
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [crates, rom, verify, release_check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }

      - name: Next version via sem (dry-run)
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when no bump
        id: gate
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" != "true" ]; then
            echo "::notice::No version bump — skipping prerelease."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.sem.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${{ steps.sem.outputs.new_release_version }}"

      # The licence gate. crates.io has no delete — only yank — and npm unpublish is a 72-hour
      # window, so an artifact published under the wrong licence is effectively permanent. The repo
      # currently has NO LICENSE file while every crate claims "MIT OR Apache-2.0"; refuse to build a
      # release artifact until those two agree. (This is not hypothetical: @spacedevin/deck shipped
      # two versions under the wrong licence and both had to be yanked.)
      - name: Refuse to package without a licence
        if: steps.gate.outputs.continue == 'true'
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ] && [ ! -f LICENSE.txt ]; then
            echo "::error::No LICENSE file at the repo root, but crates/*/Cargo.toml and packages/package.json declare \"MIT OR Apache-2.0\". Add the LICENSE file, or correct the declarations, before anything is published."
            exit 1
          fi

      - name: Stamp the version and pack the engine package
        if: steps.gate.outputs.continue == 'true'
        run: |
          V="${{ steps.gate.outputs.version }}"
          node -e '
            const fs = require("fs"), p = "packages/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$V"
          (cd packages && npm pack)
          mv packages/chuggie-engine-*.tgz tish-gba-npm-package.tgz
          ls -l tish-gba-npm-package.tgz

      - name: Create the prerelease via @sem/github
        if: steps.gate.outputs.continue == 'true'
        uses: tishlang/sem@v1
        with:
          force: ${{ steps.gate.outputs.version }}
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              - - "@sem/npm"
                - npmPublish: false
                  pkgRoot: packages
              - - "@sem/github"
                - prerelease: true
                  successComment: false
                  assets:
                    - path: tish-gba-npm-package.tgz
                      name: tish-gba-npm-package.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
