# Publish @schlopai/chuggie to npm when a GitHub release is promoted from prerelease to full
# release. The publish is driven by sem's @sem/npm plugin — the same tool that computes the version,
# writes the notes and opens the prerelease in ci.yml — not by hand-rolled npm commands.
#
# sem republishes automatically when a git tag exists but the version is missing from npm, which is
# exactly the promote case: ci.yml tagged and prereleased it, promotion means ship it.
#
# There is no manual trigger. Promotion by a human is the only way anything publishes.
#
# AUTH: npm OIDC trusted publishing (no long-lived NPM_TOKEN — npm forces granular tokens to expire,
# so OIDC is the only durable option). Requires a ONE-TIME setup on npmjs.com for `@schlopai/chuggie`:
#   the package > Settings > "Trusted Publisher" > GitHub Actions:
#     Organization or user: schlopai
#     Repository:           chuggie
#     Workflow filename:    npm-release.yml
#     Environment:          (leave blank)
# Until that is done a publish fails with E404/E422. Needs npm >= 11.5.1 and id-token: write.
#
# Only ONE package publishes: packages/ (the tish authoring layer). Every examples/* package is
# `private: true` and stays that way — they are games, not libraries.

name: NPM release

on:
  release:
    types: [published, edited]

jobs:
  publish:
    name: Publish @schlopai/chuggie to npm
    # Promote path, gated exactly as tishlang/sem's own npm-release.yml gates it.
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write   # sem updates the release
      issues: write     # @sem/github opens a failure issue rather than dying silently
      id-token: write   # npm OIDC trusted publishing
    env:
      # Provenance off: the version being published was built in a different run (ci.yml), so this
      # run cannot attest to how it was produced.
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: |
          npm install -g "npm@^11"
          npm --version

      - name: Publish via sem
        uses: tishlang/sem@v1
        with:
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              - ["@sem/npm", { "npmPublish": true, "pkgRoot": "packages" }]
              - "@sem/github"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
