# Publish the chuggie crates to crates.io when a GitHub release is promoted from prerelease to full
# release. Runs in parallel with the NPM release workflow.
#
# The publish is driven by sem's @sem/cargo plugin — the same tool that computes the version, writes
# the notes and opens the prerelease in ci.yml. sem publishes in the order given, skips crates
# already on crates.io so a re-run resumes, and waits out crates.io rate limits.
#
# There is no manual trigger. Promotion by a human is the only way anything publishes.

name: Crates.io release

on:
  release:
    types: [published, edited]

jobs:
  publish:
    name: Publish to crates.io
    # Promote path, gated exactly as tishlang/sem's own npm-release.yml gates it.
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write   # sem updates the release
      issues: write     # @sem/github opens a failure issue rather than dying silently
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # .cargo/config.toml patches agb to a git fork and tishlang_runtime_gba to a path inside
      # node_modules. cargo refuses to publish a crate that resolves through either, and the patch
      # is a local-development convenience the published crates do not need: their manifests carry
      # real version requirements alongside the path.
      - name: Strip the local patch
        run: rm -f .cargo/config.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Publish via sem
        uses: tishlang/sem@v1
        with:
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              # Dependency order: crates.io rejects a crate whose dependencies are not up yet.
              # scenepack has no internal deps; tish_agb_sio and tish_agb take tishlang_runtime_gba
              # from crates.io (published by tishlang/tish); tish_gba_game_engine takes tish_agb.
              - ["@sem/cargo", {
                    "crates": [
                      "tish_gba_scenepack",
                      "tish_agb_sio",
                      "tish_agb",
                      "tish_gba_game_engine"
                    ]
                  }]
              - "@sem/github"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
