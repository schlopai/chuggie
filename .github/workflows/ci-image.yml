# Build and publish the CI toolchain image.
#
# Everything CI needs that does not change between runs — libmgba 0.10.5, the pinned rust nightly,
# agb-gbafix, node, the apt packages — lives in one image instead of being reassembled in every
# matrix job. See .github/docker/ci.Dockerfile.
#
# Runs only when the Dockerfile changes, or by hand. The image is tagged with the Dockerfile's own
# hash, so ci.yml pins an exact image and a rebuild cannot silently change what the jobs run on.
name: CI image

on:
  push:
    branches: [main]
    paths:
      - ".github/docker/ci.Dockerfile"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - ".github/docker/ci.Dockerfile"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag from the Dockerfile's content
        id: tag
        run: |
          h=$(sha256sum .github/docker/ci.Dockerfile | cut -c1-12)
          echo "tag=$h" >> "$GITHUB_OUTPUT"
          echo "Image tag: $h"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull request the image is BUILT but not pushed — a broken Dockerfile fails there rather
      # than on main, and a fork's PR cannot push to the registry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/chuggie-ci:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/chuggie-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to pin
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice::Pin ci.yml to ghcr.io/${{ github.repository_owner }}/chuggie-ci:${{ steps.tag.outputs.tag }}"
