# Build and publish the CI toolchain image.
#
# Everything CI needs that does not change between runs — libmgba 0.10.5, the pinned rust nightly,
# agb-gbafix, node, the apt packages — lives in one image instead of being reassembled in every
# matrix job. See .github/docker/ci.Dockerfile.
#
# Runs only when the Dockerfile changes, or by hand — NOT on an ordinary push, so this costs a
# normal CI run nothing. The image is tagged with the Dockerfile's own hash, so ci.yml pins an exact
# image, a rebuild cannot silently change what the jobs run on, and two branches editing the
# Dockerfile cannot clobber each other's tag.
name: CI image

on:
  push:
    branches: [main]
    paths:
      - ".github/docker/ci.Dockerfile"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - ".github/docker/ci.Dockerfile"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag from the Dockerfile's content
        id: tag
        run: |
          h=$(sha256sum .github/docker/ci.Dockerfile | cut -c1-12)
          echo "tag=$h" >> "$GITHUB_OUTPUT"
          echo "Image tag: $h"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branches in this repo DO push, because ci.yml pins the content hash: a PR that edits the
      # Dockerfile has to be able to pull the image it just described, and a content-addressed tag
      # cannot collide with another branch's. Only main moves `latest`. A fork's PR builds without
      # pushing — it has no registry write — so a broken Dockerfile still fails there.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          push: ${{ github.event.pull_request.head.repo.fork != true }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/chuggie-ci:${{ steps.tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/chuggie-ci:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to pin
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice::Pin ci.yml to ghcr.io/${{ github.repository_owner }}/chuggie-ci:${{ steps.tag.outputs.tag }}"
